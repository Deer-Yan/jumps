<!DOCTYPE html>
<html lang="en" class="intro-lock">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fdf6f4">
<title>Hellooo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --blush:#fdf6f4;
  --blush-2:#fbeae6;
  --petal:#f6d7d2;
  --rose:#e8a8a8;
  --rose-deep:#d48b8b;
  --cream:#fffdfb;
  --ink:#6b5560;
  --ink-soft:#9a8590;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:'Quicksand', sans-serif;
  background:var(--blush);
  color:var(--ink);
  overflow-x:hidden;
}

/* ---------- decorative ---------- */
.dots{
  position:absolute; inset:0; pointer-events:none; opacity:.6;
  background-image: radial-gradient(currentColor 1.2px, transparent 1.6px);
  background-size:30px 30px;
  color:rgba(232,168,168,.16);
}

/* ---------- page shell ---------- */
.page{
  position:relative;
  min-height:100vh; min-height:100dvh;
  width:100%;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:70px 24px; overflow:hidden; text-align:center;
  background:linear-gradient(170deg,var(--blush) 0%,var(--blush-2) 55%,var(--petal) 100%);
}
.page-inner{ position:relative; z-index:2; max-width:640px; width:100%; }
.eyebrow{ font-family:'Caveat', cursive; font-size:1.3rem; color:var(--rose-deep); margin:0 0 6px; }
.reveal{ opacity:0; transform:translateY(22px); transition:opacity .8s ease, transform .8s ease; }
.reveal.in{ opacity:1; transform:translateY(0); }

/* ---------- photo placeholder ---------- */
.ph{
  position:relative;
  background:repeating-linear-gradient(135deg,#f7eae7 0 10px,#f2e0dc 10px 20px);
  display:flex; align-items:center; justify-content:center;
  color:#d3b3ae; overflow:hidden;
}
.ph svg{ width:26%; height:26%; opacity:.75; }
.ph img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; cursor:zoom-in; }

/* ---------- lightbox ---------- */
.lightbox{
  position:fixed; inset:0; z-index:200;
  background:rgba(107,85,96,.82); backdrop-filter:blur(3px);
  display:none; align-items:center; justify-content:center;
  padding:30px; cursor:zoom-out; opacity:0; transition:opacity .25s ease;
}
.lightbox.open{ display:flex; opacity:1; }
.lightbox img{ max-width:min(90vw,520px); max-height:85vh; border-radius:10px; box-shadow:0 24px 60px rgba(107,85,96,.4); }

/* ---------- polaroid ---------- */
.polaroid{
  background:var(--cream); padding:9px 9px 26px;
  box-shadow:0 8px 22px rgba(212,139,139,.2);
  display:inline-block; border-radius:8px;
}
.polaroid .ph{ width:100%; aspect-ratio:4/5; border-radius:4px; }
.polaroid figcaption{ font-family:'Caveat', cursive; font-size:1.15rem; color:var(--ink-soft); margin-top:7px; text-align:center; }
.tape{
  position:absolute; width:54px; height:20px;
  background:rgba(227,192,138,.4); border:1px solid rgba(255,255,255,.55);
  top:-10px; left:50%; transform:translateX(-50%) rotate(-3deg); border-radius:2px;
}

/* ============ COVER ============ */
.cover-photo{ position:relative; width:min(58vw,210px); margin:0 auto 24px; transform:rotate(-3deg); }
.cover-name{ font-family:'Caveat', cursive; font-weight:600; font-size:clamp(2rem,8vw,3rem); color:var(--rose-deep); margin:6px 0 4px; }
.cover-date{ letter-spacing:.08em; font-size:.8rem; color:var(--ink-soft); margin-bottom:20px; }
.cover-quote{ color:var(--ink-soft); font-size:.98rem; max-width:400px; margin:0 auto; }
.heart-row{ margin-top:24px; font-size:1rem; color:var(--rose); letter-spacing:.5em; }

footer{ text-align:center; padding:34px 20px 44px; background:var(--petal); color:var(--ink); font-family:'Caveat', cursive; font-size:1.2rem; }

/* ---------- confetti ---------- */
.confetti{ position:fixed; top:-12px; z-index:80; pointer-events:none; animation:fall linear forwards; }
@keyframes fall{ to{ transform:translateY(112vh) rotate(400deg); opacity:.9; } }

/* ---------- floating hearts ---------- */
.hearts-bg{ position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
.floating-heart{ position:absolute; bottom:-10vh; animation:floatUp linear infinite; will-change:transform,opacity; }
@keyframes floatUp{
  0%{ transform:translateY(0) translateX(0) rotate(0deg); opacity:0; }
  10%{ opacity:.8; }
  50%{ transform:translateY(-55vh) translateX(var(--drift,20px)) rotate(180deg); }
  90%{ opacity:.55; }
  100%{ transform:translateY(-110vh) translateX(0) rotate(360deg); opacity:0; }
}

/* ---------- intro envelope screen ---------- */
html.intro-lock, html.intro-lock body{ overflow:hidden; height:100%; }
.intro-overlay{
  position:fixed; inset:0; z-index:300;
  background:linear-gradient(170deg,var(--blush) 0%,var(--blush-2) 60%,var(--petal) 100%);
  display:flex; align-items:center; justify-content:center;
  transition:opacity .7s ease, visibility .7s ease;
}
.intro-overlay.gone{ opacity:0; visibility:hidden; pointer-events:none; }
.envelope-scene{ position:relative; display:flex; flex-direction:column; align-items:center; perspective:1200px; z-index:2; }
.envelope{ position:relative; width:min(74vw,250px); aspect-ratio:250/168; }
.envelope-pocket{
  position:absolute; inset:0; background:var(--cream); border:2px solid var(--petal); border-radius:10px;
  box-shadow:0 14px 34px rgba(212,139,139,.25);
  clip-path:polygon(0 0,50% 42%,100% 0,100% 100%,0 100%);
}
.envelope-letter{
  position:absolute; left:8%; right:8%; top:11%; height:70%;
  background:var(--blush); border-radius:6px; box-shadow:0 6px 16px rgba(212,139,139,.2);
  padding:14px 13px; text-align:left; transform:translateY(6%);
  transition:transform 1s cubic-bezier(.34,1.56,.64,1) .35s; z-index:1;
}
.envelope-letter-line{ height:6px; border-radius:3px; background:rgba(232,168,168,.28); margin:0 0 7px; }
.envelope-letter-line.short{ width:58%; }
.envelope-from{
  position:absolute; top:calc(52% + 38px); left:50%; transform:translateX(-50%);
  font-family:'Caveat', cursive; font-size:1.15rem; color:var(--rose-deep); margin:0; z-index:4;
  white-space:nowrap; transition:opacity .4s ease;
}
.envelope.opened .envelope-from{ opacity:0; }
.envelope-flap{
  position:absolute; top:0; left:50%; width:0; height:0;
  border-left:min(37vw,125px) solid transparent; border-right:min(37vw,125px) solid transparent;
  border-top:68px solid var(--petal);
  transform:translateX(-50%) rotateX(0deg); transform-origin:top center;
  transition:transform 1s cubic-bezier(.65,0,.35,1); z-index:2;
  filter:drop-shadow(0 2px 4px rgba(212,139,139,.25));
}
.envelope-stamp{
  position:absolute; top:52%; left:50%; transform:translate(-50%,-50%);
  width:56px; height:56px; border-radius:50%; border:2px dashed var(--rose);
  background:var(--cream); color:var(--rose-deep);
  display:flex; align-items:center; justify-content:center; font-size:1.5rem;
  cursor:pointer; z-index:4; padding:0; box-shadow:0 6px 16px rgba(212,139,139,.3);
  animation:stampBeat 1.8s ease-in-out infinite; transition:opacity .4s ease;
  -webkit-tap-highlight-color:transparent;
}
@keyframes stampBeat{ 0%,100%{ transform:translate(-50%,-50%) scale(1); } 50%{ transform:translate(-50%,-50%) scale(1.08); } }
.envelope-stamp:active{ animation:none; transform:translate(-50%,-50%) scale(.92); }
.envelope.opened .envelope-flap{ transform:translateX(-50%) rotateX(180deg); }
.envelope.opened .envelope-letter{ transform:translateY(-48%); z-index:6; }
.envelope.opened .envelope-stamp{ opacity:0; pointer-events:none; animation:none; }
.intro-title{ font-family:'Caveat', cursive; font-size:1.6rem; color:var(--rose-deep); margin:0 0 22px; }
.intro-hint{ margin-top:26px; font-size:.9rem; color:var(--ink-soft); animation:hintPulse 1.8s ease-in-out infinite; transition:opacity .3s ease; }
@keyframes hintPulse{ 0%,100%{ opacity:.5; } 50%{ opacity:1; } }

/* ---------- jumpscare (before the envelope opens) ---------- */
.jumpscare{
  position:fixed; inset:0; z-index:400;
  background:#0a0a0a;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  opacity:0; pointer-events:none;
}
.jumpscare.show{ opacity:1; animation:scareShake .4s ease; }
.jumpscare-video{
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; opacity:0;
}
.jumpscare.show .jumpscare-video{ opacity:1; }
.jumpscare-face{
  position:relative; font-size:0; line-height:1;
  filter:drop-shadow(0 0 20px rgba(255,255,255,.25));
  display:none;
}
.jumpscare.no-video .jumpscare-face{ display:block; }
.jumpscare.show.no-video .jumpscare-face{
  animation:scareZoom .35s cubic-bezier(.2,.8,.3,1.4) forwards;
}
@keyframes scareZoom{
  0%{ font-size:0; transform:scale(.4); }
  55%{ font-size:11rem; transform:scale(1.25); }
  100%{ font-size:9.5rem; transform:scale(1); }
}
@keyframes scareShake{
  0%,100%{ transform:translate(0,0); }
  20%{ transform:translate(-9px,5px); }
  40%{ transform:translate(9px,-5px); }
  60%{ transform:translate(-7px,-7px); }
  80%{ transform:translate(7px,7px); }
}
.jumpscare-text{
  position:relative;
  color:#fff; font-family:'Caveat', cursive; font-size:1.7rem; margin-top:8px;
  opacity:0; display:none;
}
.jumpscare.no-video .jumpscare-text{ display:block; }
.jumpscare.show.no-video .jumpscare-text{ animation:scareTextIn .3s ease .28s forwards; }
@keyframes scareTextIn{ to{ opacity:1; } }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; }
}
</style>
</head>
<body>

<div class="jumpscare" id="jumpscare">
  <video id="jumpscareVideo" class="jumpscare-video" src="video/jumpscare.mp4" playsinline preload="auto"></video>
  <div class="jumpscare-face">👻</div>
  <p class="jumpscare-text">gotcha! 😂</p>
</div>

<div class="intro-overlay" id="introOverlay">
  <div class="envelope-scene">
    <p class="intro-title">a little something for you ♡</p>
    <div class="envelope" id="envelope">
      <div class="envelope-pocket"></div>
      <div class="envelope-letter" id="envelopeLetter">
        <div class="envelope-letter-line"></div>
        <div class="envelope-letter-line"></div>
        <div class="envelope-letter-line short"></div>
      </div>
      <div class="envelope-flap" id="envelopeFlap"></div>
      <button class="envelope-stamp" id="envelopeStamp" aria-label="Tap the stamp to open the letter"><span>♡</span></button>
      <p class="envelope-from">from :</p>
    </div>
    <p class="intro-hint" id="introHint">tap the stamp to open</p>
  </div>
</div>

<div class="hearts-bg" id="heartsBg"></div>

<!-- ============ COVER ============ -->
<section class="page" id="s1">
  <div class="dots"></div>
  <div class="page-inner">
    <div class="cover-photo polaroid reveal">
      <div class="tape"></div>
      <div class="ph"><img src="photos/cover.jpg" alt="" onerror="this.style.display='none'" onload="this.nextElementSibling.style.display='none'"><svg viewBox="0 0 24 24" fill="none"><path d="M4 7h3l1.5-2h7L17 7h3a1 1 0 011 1v11a1 1 0 01-1 1H4a1 1 0 01-1-1V8a1 1 0 011-1z" stroke="currentColor" stroke-width="1.4"/><circle cx="12" cy="13" r="3.4" stroke="currentColor" stroke-width="1.4"/></svg></div>
      <figcaption></figcaption>
    </div>
    <p class="eyebrow reveal">Got You</p>
    <h1 class="cover-name reveal"></h1>
    <p class="cover-date reveal"></p>
    <p class="cover-quote reveal">A little letter made just for you ♡</p>
    <div class="heart-row reveal">♡ ♡ ♡</div>
  </div>
</section>

<footer>made with love, just for you ♡</footer>

<div class="lightbox" id="lightbox"><img id="lightboxImg" src="" alt=""></div>

<script>
  // jumpscare — plays a video right when the stamp is tapped, before the envelope opens
  const jumpscare = document.getElementById('jumpscare');
  const jumpscareVideo = document.getElementById('jumpscareVideo');
  function playScareSound(){
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(55, ctx.currentTime + 0.4);
      gain.gain.setValueAtTime(0.25, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.45);
    }catch(e){}
  }
  function triggerJumpscare(callback){
    jumpscare.classList.remove('no-video');
    jumpscare.classList.add('show');

    let finished = false;
    function finish(){
      if(finished) return;
      finished = true;
      jumpscare.classList.remove('show','no-video');
      jumpscareVideo.pause();
      callback();
    }
    function useFallback(){
      jumpscare.classList.add('no-video');
      playScareSound();
      setTimeout(finish, 800);
    }

    jumpscareVideo.currentTime = 0;
    jumpscareVideo.muted = false;
    jumpscareVideo.addEventListener('ended', finish, { once:true });
    jumpscareVideo.addEventListener('error', useFallback, { once:true });
    const playPromise = jumpscareVideo.play();
    if(playPromise && playPromise.catch){
      playPromise.catch(()=>{
        jumpscareVideo.muted = true;
        jumpscareVideo.play().catch(useFallback);
      });
    }
    setTimeout(finish, 4500);
  }

  // intro envelope — tap the stamp to open, then reveal the cover
  const introOverlay = document.getElementById('introOverlay');
  const envelope = document.getElementById('envelope');
  const envelopeStamp = document.getElementById('envelopeStamp');
  const introHint = document.getElementById('introHint');
  envelopeStamp.addEventListener('click', ()=>{
    triggerJumpscare(()=>{
      envelope.classList.add('opened');
      introHint.style.opacity = '0';
      setTimeout(()=>{
        introOverlay.classList.add('gone');
        document.documentElement.classList.remove('intro-lock');
        confettiBurst();
      }, 900);
      setTimeout(()=>{ introOverlay.remove(); }, 1700);
    });
  });

  // floating hearts
  const heartsBg = document.getElementById('heartsBg');
  const heartSymbols = ['♡','❤','🤍'];
  const heartColors = ['#e8a8a8','#f6d7d2','#e3dcf0','#cfe0d3'];
  function spawnHeart(){
    const h = document.createElement('div');
    h.className = 'floating-heart';
    h.textContent = heartSymbols[Math.floor(Math.random()*heartSymbols.length)];
    h.style.left = Math.random()*100 + 'vw';
    h.style.fontSize = (13 + Math.random()*16) + 'px';
    h.style.color = heartColors[Math.floor(Math.random()*heartColors.length)];
    h.style.animationDuration = (10 + Math.random()*9) + 's';
    h.style.setProperty('--drift', (Math.random()*70 - 35) + 'px');
    heartsBg.appendChild(h);
    setTimeout(()=> h.remove(), 20000);
  }
  for(let i=0;i<6;i++) setTimeout(spawnHeart, i*400);
  setInterval(spawnHeart, 1100);

  // reveal cover content once (no scroll/menu to trigger it, so show right away)
  document.querySelectorAll('.reveal').forEach(el=> el.classList.add('in'));

  // photo — tap to view full size
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  document.querySelectorAll('.ph img').forEach(img=>{
    img.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(img.style.display === 'none' || !img.complete || img.naturalWidth === 0) return;
      lightboxImg.src = img.src;
      lightbox.classList.add('open');
    });
  });
  lightbox.addEventListener('click', ()=> lightbox.classList.remove('open'));

  // confetti — fires when the envelope opens
  function confettiBurst(){
    const colors = ['#e8a8a8','#f6d7d2','#e3dcf0','#cfe0d3','#e3c08a','#fffdfb'];
    for(let i=0;i<30;i++){
      const c = document.createElement('div');
      c.className='confetti';
      c.style.left = Math.random()*100+'vw';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.width = (5+Math.random()*5)+'px';
      c.style.height = (9+Math.random()*7)+'px';
      c.style.borderRadius = Math.random()>.5 ? '50%' : '2px';
      c.style.animationDuration = (2.4+Math.random()*1.6)+'s';
      c.style.animationDelay = (Math.random()*.6)+'s';
      document.body.appendChild(c);
      setTimeout(()=>c.remove(), 4600);
    }
  }
</script>

</body>
</html>
